<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLEAN YOUR TV - Apple TV Style</title>
    <style>
        * {
            box-sizing: border-box;
            direction: rtl;
        }
        body {
            margin: 0;
            padding: 60px 80px;
            background: #08080a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .user-tag {
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.1rem;
        }
        .section-title {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.6);
            margin: 30px 0 15px 0;
            font-weight: 500;
        }
        .grid {
            display: flex;
            gap: 30px;
            justify-content: flex-start;
        }
        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 35px 20px;
            width: 200px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 500;
            color: #e5e5e7;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        /* تأثير التحديد المستوحى من Apple TV */
        .card:focus, .card:hover {
            background: #ffffff;
            color: #000000;
            transform: scale(1.12);
            box-shadow: 0 20px 40px rgba(255, 255, 255, 0.3), 0 0 0 4px rgba(255, 255, 255, 0.5);
            border-color: #ffffff;
            outline: none;
        }
        footer {
            text-align: center;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>CLEAN YOUR TV</h1>
        <div class="user-tag">تصميم: يوسف</div>
    </header>

    <div>
        <div class="section-title">الوصول السريع</div>
        <div class="grid">
            <div class="card" tabindex="1">يوتيوب</div>
            <div class="card" tabindex="2">نتفليكس</div>
            <div class="card" tabindex="3">برايم فيديو</div>
            <div class="card" tabindex="4">ديزني+</div>
        </div>

        <div class="section-title">أدوات التنظيف والصيانة</div>
        <div class="grid">
            <div class="card" tabindex="5">تحسين الأداء</div>
            <div class="card" tabindex="6">تنظيف الملفات</div>
            <div class="card" tabindex="7">تحديثات النظام</div>
            <div class="card" tabindex="8">صحة التلفزيون</div>
        </div>
    </div>

    <footer>
        استخدم أسهم الريموت للتنقل
    </footer>

</body>
</html>
