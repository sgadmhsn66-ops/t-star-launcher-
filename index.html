<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Star TV Launcher</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }
        header {
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin: 0;
            color: #00bcd4;
            text-shadow: 0 0 10px rgba(0, 188, 212, 0.5);
        }
        p {
            color: #aaa;
            font-size: 1.2rem;
        }
        .grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border: 3px solid transparent;
            border-radius: 15px;
            padding: 30px;
            width: 200px;
            text-align: center;
            font-size: 1.5rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .card:focus, .card:hover {
            border-color: #00bcd4;
            background-color: #2c2c2c;
            transform: scale(1.05);
            outline: none;
        }
        footer {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>T-Star TV</h1>
        <p>واجهة Android 13 المخصصة - تصميم يوسف</p>
    </header>

    .grid {
        <div class="card" tabindex="1">YouTube</div>
        <div class="card" tabindex="2">Netflix</div>
        <div class="card" tabindex="3">التطبيقات</div>
        <div class="card" tabindex="4">الإعدادات</div>
    </div>

    <footer>
        استخدم أزرار الأسهم في الريموت لتحديد التطبيق واضغط OK
    </footer>

</body>
</html>
